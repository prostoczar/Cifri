    <rect x="594.4" y="548.35" width="84.4" height="55.7" rx="27.85" transform="rotate(319.23 636.6 576.2)"></rect>
    <rect x="597.6" y="347.35" width="84.4" height="55.7" rx="27.85" transform="rotate(44.85 639.8 375.2)"></rect>
    <rect x="810.1" y="549.25" width="84.4" height="55.7" rx="27.85" transform="rotate(44.85 852.3 577.1)"></rect>
  </g>
  <rect x="610" y="639.2" width="272" height="134.6" rx="67.3" fill="#ffd166" transform="rotate(270 746 706.5)"></rect>
  <circle cx="746" cy="478.5" r="67.3" fill="#ffd166"></circle>
</svg>

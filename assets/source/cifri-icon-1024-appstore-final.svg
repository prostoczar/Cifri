<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Full-bleed dark-beige base, sharp corners, fully opaque — guarantees zero transparency anywhere, including all 4 true corners -->
  <rect x="0" y="0" width="1024" height="1024" fill="#d8d0c6"></rect>

  <!-- Beige card, rounded on all corners, shifted above the canvas so its TOP corners curve off-canvas (stays flat/full at the top) while its BOTTOM corners curve into view — this is what makes the dark-beige reveal follow the same curve as the icon's own rounding, instead of cutting a straight line across it -->
  <rect x="0" y="-230" width="1024" height="1185" rx="225" fill="#fdf8f3"></rect>

  <!-- Mark: unchanged from the approved final logo -->
  <path d="M580.1,747 A299.5,299.5 0 1 1 599.9,220.7" fill="none" stroke="#0f9d6c" stroke-width="135" stroke-linecap="round"></path>
